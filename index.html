<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================
       META & RESOURCES
       ============================================ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BugVault - A portable, single-file developer issue tracker. Store bugs, errors, and solutions in your browser with no servers or accounts required.">
  <meta name="keywords" content="bug tracker, issue tracker, developer tools, error logging, debugging, knowledge base">
  <meta name="author" content="tahseen137">
  <meta name="theme-color" content="#3dd68c">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BugVault — Developer Issue Tracker">
  <meta property="og:description" content="A portable, single-file developer issue tracker. No servers, no accounts—just one HTML file.">
  <meta property="og:url" content="https://tahseen137.github.io/bugvault">
  
  <title>BugVault — Developer Issue Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- ============================================
       STYLES
       - CSS Variables & Theme
       - Base & Layout Styles
       - Component Styles (Header, Sidebar, Cards)
       - Modal & Form Styles
       - Utility & Responsive Styles
       ============================================ -->
  <style>
    :root {
      --bg-deep: #0a0a0f;
      --bg-main: #12121a;
      --bg-card: #1a1a25;
      --bg-elevated: #22222f;
      --border: #2a2a3a;
      --border-focus: #4a4a6a;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted: #5a5a70;
      --accent-green: #3dd68c;
      --accent-green-dim: #2a9963;
      --accent-red: #f0506e;
      --accent-orange: #f5a623;
      --accent-blue: #5c9eff;
      --accent-purple: #a78bfa;
      --accent-yellow: #fbbf24;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Space Grotesk', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-focus); }

    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

    .header {
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .logo { display: flex; align-items: center; gap: 0.75rem; }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-blue) 100%);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 14px;
      color: var(--bg-deep);
    }

    .logo-text { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; }
    .logo-text span { color: var(--text-muted); font-weight: 400; }

    .search-container { flex: 1; max-width: 500px; position: relative; }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.1);
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    .header-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary { background: var(--accent-green); color: var(--bg-deep); }
    .btn-primary:hover { background: #4de69c; transform: translateY(-1px); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); }
    .btn-danger:hover { background: var(--accent-red); color: white; }
    .btn-warning { background: transparent; color: var(--accent-orange); border: 1px solid var(--accent-orange); }
    .btn-warning:hover { background: var(--accent-orange); color: var(--bg-deep); }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
    .btn-xs { padding: 0.25rem 0.5rem; font-size: 0.7rem; }

    .main { display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }

    .sidebar {
      background: var(--bg-main);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
    }

    .sidebar-section { margin-bottom: 2rem; }

    .sidebar-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group { display: flex; flex-direction: column; gap: 0.25rem; }

    .filter-btn {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.625rem 0.75rem;
      background: transparent; border: none; border-radius: 6px;
      color: var(--text-secondary);
      font-family: var(--font-sans); font-size: 0.875rem;
      cursor: pointer; transition: all 0.15s ease; text-align: left;
    }

    .filter-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .filter-btn.active { background: var(--bg-elevated); color: var(--accent-green); }
    .filter-count { margin-left: auto; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }

    .tag-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .tag {
      padding: 0.375rem 0.75rem;
      background: var(--bg-elevated);
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .tag:hover { border-color: var(--border-focus); color: var(--text-primary); }
    .tag.active { background: var(--accent-green); color: var(--bg-deep); }

    .recent-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .recent-item {
      padding: 0.5rem 0.75rem;
      background: var(--bg-elevated);
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-item:hover { color: var(--text-primary); background: var(--border); }

    .date-filter { display: flex; flex-direction: column; gap: 0.5rem; }
    .date-input {
      padding: 0.5rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }
    .date-input:focus { outline: none; border-color: var(--accent-green); }

    .saved-filters { display: flex; flex-direction: column; gap: 0.5rem; }
    .saved-filter-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg-elevated);
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .saved-filter-item:hover { color: var(--text-primary); background: var(--border); }
    .saved-filter-item .filter-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .saved-filter-item .delete-filter { opacity: 0; color: var(--accent-red); cursor: pointer; font-size: 1rem; line-height: 1; }
    .saved-filter-item:hover .delete-filter { opacity: 1; }

    .active-filters {
      display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;
      padding: 0.75rem;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .active-filter-tag {
      display: flex; align-items: center; gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      background: var(--accent-blue);
      color: var(--bg-deep);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .active-filter-tag .remove { cursor: pointer; font-weight: bold; margin-left: 0.25rem; }

    .highlight { background: var(--accent-yellow); color: var(--bg-deep); padding: 0 2px; border-radius: 2px; }

    .drop-zone {
      border: 2px dashed var(--accent-green);
      background: rgba(61, 214, 140, 0.1);
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--accent-green);
    }
    .drop-zone.active { display: flex; }

    .backup-indicator {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: none;
    }
    .backup-indicator.show { display: block; }

    .bulk-actions {
      display: none;
      gap: 0.5rem;
      padding: 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      align-items: center;
    }
    .bulk-actions.active { display: flex; }
    .bulk-count { font-size: 0.875rem; color: var(--text-secondary); margin-right: auto; }

    .issue-checkbox {
      width: 18px; height: 18px;
      accent-color: var(--accent-green);
      cursor: pointer;
      flex-shrink: 0;
    }

    .content { padding: 2rem; overflow-y: auto; background: var(--bg-deep); }

    .content-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap;
    }

    .content-title { font-size: 1.25rem; font-weight: 600; }

    .content-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    .sort-select {
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      cursor: pointer;
    }

    .issues-list { display: flex; flex-direction: column; gap: 1rem; }

    .issue-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .issue-card:hover {
      border-color: var(--border-focus);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .issue-card.pinned { border-color: var(--accent-orange); }
    .issue-card.pinned::before {
      content: '📌';
      position: absolute;
      top: -8px;
      right: 12px;
      font-size: 1rem;
    }

    .issue-card.selected { border-color: var(--accent-green); background: rgba(61, 214, 140, 0.05); }

    .issue-header { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 0.75rem; }
    .issue-title { font-weight: 600; font-size: 1rem; flex: 1; line-height: 1.4; }
    .issue-date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }

    .issue-error {
      background: var(--bg-deep);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-red);
      margin-bottom: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .issue-meta { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .issue-project { display: flex; align-items: center; gap: 0.375rem; font-size: 0.8rem; color: var(--accent-blue); }
    .issue-tags { display: flex; gap: 0.375rem; flex-wrap: wrap; }
    .issue-tag { padding: 0.25rem 0.5rem; background: var(--bg-elevated); border-radius: 4px; font-size: 0.7rem; font-family: var(--font-mono); color: var(--text-secondary); }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty-title { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 0.5rem; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden;
      transition: all 0.2s ease; padding: 2rem;
    }

    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%; max-width: 700px; max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal { transform: translateY(0); }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-title { font-size: 1.125rem; font-weight: 600; }

    .modal-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none;
      color: var(--text-muted); cursor: pointer;
      border-radius: 6px; font-size: 1.25rem;
      transition: all 0.15s ease;
    }

    .modal-close:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .modal-body { padding: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-secondary); }
    .form-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.1);
    }

    .form-textarea { min-height: 100px; resize: vertical; font-family: var(--font-mono); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .modal-footer {
      display: flex; justify-content: flex-end; gap: 0.75rem;
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border);
    }

    .detail-section { margin-bottom: 1.5rem; }
    .detail-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.5rem; }

    .detail-error {
      background: var(--bg-card); border-radius: 8px; padding: 1rem;
      font-family: var(--font-mono); font-size: 0.85rem;
      color: var(--accent-red); white-space: pre-wrap; word-break: break-word;
      border-left: 3px solid var(--accent-red);
    }

    .detail-solution {
      background: var(--bg-card); border-radius: 8px; padding: 1rem;
      font-size: 0.9rem; line-height: 1.7;
      border-left: 3px solid var(--accent-green);
    }

    .detail-solution code {
      background: var(--bg-deep);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-purple);
    }

    .detail-solution pre {
      background: var(--bg-deep);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.75rem 0;
    }

    .detail-solution pre code { background: none; padding: 0; color: var(--text-primary); }
    .detail-solution a { color: var(--accent-blue); text-decoration: none; }
    .detail-solution a:hover { text-decoration: underline; }

    .detail-context { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7; }

    .detail-meta {
      display: flex; flex-wrap: wrap; gap: 1.5rem;
      padding-top: 1rem; border-top: 1px solid var(--border);
    }

    .detail-meta-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .detail-meta-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .detail-meta-value { font-size: 0.875rem; color: var(--text-primary); }

    .detail-actions {
      display: flex; gap: 0.75rem; flex-wrap: wrap;
      margin-top: 1.5rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
    }

    .stat-value { font-size: 2rem; font-weight: 700; font-family: var(--font-mono); margin-bottom: 0.25rem; color: var(--accent-blue); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); }

    .share-link {
      display: flex; gap: 0.5rem; margin-top: 1rem;
      padding: 0.75rem;
      background: var(--bg-elevated);
      border-radius: 6px;
    }
    .share-link input {
      flex: 1;
      padding: 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .form-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .header { flex-wrap: wrap; padding: 1rem; }
      .search-container { order: 3; max-width: none; width: 100%; }
      .content { padding: 1rem; }
      .detail-actions { flex-direction: column; }
      .detail-actions .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="padding: 2rem; text-align: center; font-family: sans-serif; background: #12121a; color: #e8e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
      <div>
        <h1 style="font-size: 2rem; margin-bottom: 1rem;">⚠️ JavaScript Required</h1>
        <p>BugVault requires JavaScript to function. Please enable JavaScript in your browser settings.</p>
      </div>
    </div>
  </noscript>
  <div class="drop-zone" id="dropZone" role="alert" aria-live="assertive">📁 Drop JSON file to import</div>
  <div class="backup-indicator" id="backupIndicator">💾 Auto-backup saved</div>

  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">🐛</div>
        <div class="logo-text">BugVault <span>Issue Tracker</span></div>
      </div>
      
      <div class="search-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search issues, errors, solutions..." aria-label="Search issues">
      </div>

      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="toggleBulkMode()" id="bulkModeBtn" aria-label="Toggle bulk selection mode">Select</button>
        <button class="btn btn-secondary" onclick="exportData()" aria-label="Export all issues as JSON">Export</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()" aria-label="Import issues from JSON file">Import</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" aria-label="Choose JSON file to import">
        <button class="btn btn-primary" onclick="openModal('add')" aria-label="Create new issue">+ New Issue</button>
      </div>
    </header>
    <main class="main" role="main">
      <aside class="sidebar" role="complementary" aria-label="Filters and navigation">
        <div class="sidebar-section">
          <div class="sidebar-title">Projects</div>
          <div class="filter-group" id="projectFilters"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Tags</div>
          <div class="tag-list" id="tagFilters"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Date Range</div>
          <div class="date-filter">
            <label style="font-size: 0.75rem; color: var(--text-muted);">From</label>
            <input type="date" class="date-input" id="dateFrom" onchange="applyFilters()">
            <label style="font-size: 0.75rem; color: var(--text-muted);">To</label>
            <input type="date" class="date-input" id="dateTo" onchange="applyFilters()">
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">
            Saved Filters
            <button class="btn btn-xs btn-secondary" onclick="saveCurrentFilter()">Save</button>
          </div>
          <div class="saved-filters" id="savedFilters"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Recently Viewed</div>
          <div class="recent-list" id="recentlyViewed"></div>
        </div>
      </aside>

      <section class="content">
        <div id="activeFiltersContainer" class="active-filters" style="display: none;"></div>
        
        <div class="bulk-actions" id="bulkActions">
          <span class="bulk-count"><span id="selectedCount">0</span> selected</span>
          <button class="btn btn-sm btn-secondary" onclick="bulkEditProject()">Change Project</button>
          <button class="btn btn-sm btn-secondary" onclick="bulkEditTags()">Add Tags</button>
          <button class="btn btn-sm btn-danger" onclick="bulkDelete()">Delete</button>
          <button class="btn btn-sm btn-secondary" onclick="cancelBulkMode()">Cancel</button>
        </div>

        <div class="content-header">
          <h2 class="content-title" id="contentTitle">All Issues</h2>
          <div class="content-actions">
            <button class="btn btn-sm btn-secondary" onclick="clearAllFilters()" id="clearFiltersBtn" style="display: none;">Clear Filters</button>
            <select class="sort-select" id="sortSelect" onchange="applyFilters()">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="title">Title A-Z</option>
            </select>
          </div>
        </div>

        <div class="issues-list" id="issuesList"></div>
      </section>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="addModal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">New Issue</h3>
        <button class="modal-close" onclick="closeModal('add')" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" class="form-input" id="issueTitle" placeholder="Brief description of the issue">
        </div>
        <div class="form-group">
          <label class="form-label">Error Message</label>
          <textarea class="form-textarea" id="issueError" placeholder="Paste the error message here"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Solution</label>
          <textarea class="form-textarea" id="issueSolution" placeholder="How did you fix it?" style="min-height: 150px;"></textarea>
          <div class="form-hint">Supports: **bold**, *italic*, `code`, ```code blocks```, [links](url)</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Project</label>
            <input type="text" class="form-input" id="issueProject" placeholder="e.g., my-app">
          </div>
          <div class="form-group">
            <label class="form-label">Tags</label>
            <input type="text" class="form-input" id="issueTags" placeholder="react, api, bug (comma separated)">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Additional Context</label>
          <textarea class="form-textarea" id="issueContext" placeholder="Any additional notes, links, or context"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('add')">Cancel</button>
        <button class="btn btn-primary" onclick="saveIssue()">Save Issue</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal" role="dialog" aria-labelledby="detailTitle" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">Issue Details</h3>
        <button class="modal-close" onclick="closeModal('detail')" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <script>
    let issues = JSON.parse(localStorage.getItem('bugvault_issues') || '[]');
    let recentlyViewed = JSON.parse(localStorage.getItem('bugvault_recent') || '[]');
    let savedFilters = JSON.parse(localStorage.getItem('bugvault_saved_filters') || '[]');
    let currentFilter = { project: null, tag: null, search: '', dateFrom: null, dateTo: null };
    let bulkMode = false;
    let selectedIssues = new Set();
    let autoBackupInterval = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadSharedIssue();
      renderFilters();
      renderIssues();
      renderRecentlyViewed();
      renderSavedFilters();
      setupDragDrop();
      setupAutoBackup();
      document.getElementById('searchInput').addEventListener('input', (e) => {
        currentFilter.search = e.target.value;
        applyFilters();
      });
    });

    // Auto-backup setup
    function setupAutoBackup() {
      autoBackupInterval = setInterval(() => {
        if (issues.length > 0) {
          const backup = { issues, exportedAt: new Date().toISOString(), version: '2.0' };
          localStorage.setItem('bugvault_auto_backup', JSON.stringify(backup));
          showBackupIndicator();
        }
      }, 5 * 60 * 1000); // Every 5 minutes
    }

    function showBackupIndicator() {
      const indicator = document.getElementById('backupIndicator');
      indicator.classList.add('show');
      setTimeout(() => indicator.classList.remove('show'), 2000);
    }

    // Drag & Drop
    function setupDragDrop() {
      const dropZone = document.getElementById('dropZone');
      ['dragenter', 'dragover'].forEach(e => {
        document.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.add('active'); });
      });
      ['dragleave', 'drop'].forEach(e => {
        document.addEventListener(e, () => dropZone.classList.remove('active'));
      });
      document.addEventListener('drop', handleDrop);
    }

    function handleDrop(e) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type === 'application/json') {
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            const importedIssues = data.issues || data;
            if (Array.isArray(importedIssues)) {
              const count = importedIssues.length;
              importedIssues.forEach(issue => {
                if (!issue.id) issue.id = Date.now() + Math.random();
                if (!issues.find(i => i.id === issue.id)) issues.push(issue);
              });
              saveIssues();
              renderFilters();
              renderIssues();
              alert(`Imported ${count} issues via drag & drop!`);
            }
          } catch (err) { alert('Invalid JSON file'); }
        };
        reader.readAsText(file);
      }
    }

    // Share issue as link
    function shareIssue(id) {
      const issue = issues.find(i => String(i.id) === String(id));
      if (!issue) return;
      const encoded = btoa(encodeURIComponent(JSON.stringify(issue)));
      const url = `${window.location.origin}${window.location.pathname}?share=${encoded}`;
      const container = document.createElement('div');
      container.className = 'share-link';
      container.innerHTML = `<input type="text" value="${url}" readonly onclick="this.select()"><button class="btn btn-sm btn-primary" onclick="navigator.clipboard.writeText('${url}');this.textContent='Copied!'">Copy</button>`;
      const detailBody = document.getElementById('detailBody');
      const existing = detailBody.querySelector('.share-link');
      if (existing) existing.remove();
      detailBody.appendChild(container);
    }

    function loadSharedIssue() {
      const params = new URLSearchParams(window.location.search);
      const shared = params.get('share');
      if (shared) {
        try {
          const issue = JSON.parse(decodeURIComponent(atob(shared)));
          issue.id = Date.now();
          if (confirm(`Import shared issue: "${issue.title}"?`)) {
            issues.push(issue);
            saveIssues();
            window.history.replaceState({}, '', window.location.pathname);
          }
        } catch (e) { console.error('Invalid shared issue'); }
      }
    }

    // Bulk mode functions
    function toggleBulkMode() {
      bulkMode = !bulkMode;
      selectedIssues.clear();
      document.getElementById('bulkModeBtn').textContent = bulkMode ? 'Cancel' : 'Select';
      document.getElementById('bulkActions').classList.toggle('active', bulkMode);
      renderIssues();
    }

    function cancelBulkMode() {
      bulkMode = false;
      selectedIssues.clear();
      document.getElementById('bulkModeBtn').textContent = 'Select';
      document.getElementById('bulkActions').classList.remove('active');
      renderIssues();
    }

    function toggleIssueSelection(id, e) {
      e.stopPropagation();
      if (selectedIssues.has(id)) selectedIssues.delete(id);
      else selectedIssues.add(id);
      document.getElementById('selectedCount').textContent = selectedIssues.size;
      renderIssues();
    }

    function bulkDelete() {
      if (selectedIssues.size === 0) return alert('No issues selected');
      if (confirm(`Delete ${selectedIssues.size} issues?`)) {
        issues = issues.filter(i => !selectedIssues.has(i.id));
        saveIssues();
        cancelBulkMode();
        renderFilters();
        renderIssues();
      }
    }

    function bulkEditProject() {
      if (selectedIssues.size === 0) return alert('No issues selected');
      const project = prompt('Enter new project name:');
      if (project) {
        issues.forEach(i => { if (selectedIssues.has(i.id)) i.project = project; });
        saveIssues();
        cancelBulkMode();
        renderFilters();
        renderIssues();
      }
    }

    function bulkEditTags() {
      if (selectedIssues.size === 0) return alert('No issues selected');
      const tags = prompt('Enter tags to add (comma separated):');
      if (tags) {
        const newTags = tags.split(',').map(t => t.trim()).filter(t => t);
        issues.forEach(i => {
          if (selectedIssues.has(i.id)) {
            const existing = i.tags || [];
            i.tags = [...new Set([...existing, ...newTags])];
          }
        });
        saveIssues();
        cancelBulkMode();
        renderFilters();
        renderIssues();
      }
    }

    // Filter functions
    function renderFilters() {
      const projects = [...new Set(issues.map(i => i.project).filter(Boolean))];
      const tags = [...new Set(issues.flatMap(i => i.tags || []))];

      document.getElementById('projectFilters').innerHTML = `
        <button class="filter-btn ${!currentFilter.project ? 'active' : ''}" onclick="filterByProject(null)">
          <span>📁</span> All Projects <span class="filter-count">${issues.length}</span>
        </button>
        ${projects.map(p => `
          <button class="filter-btn ${currentFilter.project === p ? 'active' : ''}" onclick="filterByProject('${p}')">
            <span>📂</span> ${p} <span class="filter-count">${issues.filter(i => i.project === p).length}</span>
          </button>
        `).join('')}
      `;

      document.getElementById('tagFilters').innerHTML = tags.map(t => `
        <span class="tag ${currentFilter.tag === t ? 'active' : ''}" onclick="filterByTag('${t}')">${t}</span>
      `).join('');
    }

    function filterByProject(project) {
      currentFilter.project = project;
      applyFilters();
    }

    function filterByTag(tag) {
      currentFilter.tag = currentFilter.tag === tag ? null : tag;
      applyFilters();
    }

    function applyFilters() {
      currentFilter.dateFrom = document.getElementById('dateFrom').value || null;
      currentFilter.dateTo = document.getElementById('dateTo').value || null;
      renderFilters();
      renderIssues();
      updateActiveFilters();
    }

    function updateActiveFilters() {
      const container = document.getElementById('activeFiltersContainer');
      const clearBtn = document.getElementById('clearFiltersBtn');
      const hasFilters = currentFilter.project || currentFilter.tag || currentFilter.search || currentFilter.dateFrom || currentFilter.dateTo;
      
      container.style.display = hasFilters ? 'flex' : 'none';
      clearBtn.style.display = hasFilters ? 'inline-flex' : 'none';
      
      let html = '';
      if (currentFilter.project) html += `<span class="active-filter-tag">Project: ${currentFilter.project} <span class="remove" onclick="currentFilter.project=null;applyFilters()">×</span></span>`;
      if (currentFilter.tag) html += `<span class="active-filter-tag">Tag: ${currentFilter.tag} <span class="remove" onclick="currentFilter.tag=null;applyFilters()">×</span></span>`;
      if (currentFilter.search) html += `<span class="active-filter-tag">Search: ${currentFilter.search} <span class="remove" onclick="currentFilter.search='';document.getElementById('searchInput').value='';applyFilters()">×</span></span>`;
      if (currentFilter.dateFrom) html += `<span class="active-filter-tag">From: ${currentFilter.dateFrom} <span class="remove" onclick="currentFilter.dateFrom=null;document.getElementById('dateFrom').value='';applyFilters()">×</span></span>`;
      if (currentFilter.dateTo) html += `<span class="active-filter-tag">To: ${currentFilter.dateTo} <span class="remove" onclick="currentFilter.dateTo=null;document.getElementById('dateTo').value='';applyFilters()">×</span></span>`;
      container.innerHTML = html;
    }

    function clearAllFilters() {
      currentFilter = { project: null, tag: null, search: '', dateFrom: null, dateTo: null };
      document.getElementById('searchInput').value = '';
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      applyFilters();
    }

    // Saved filters
    function saveCurrentFilter() {
      const hasFilters = currentFilter.project || currentFilter.tag || currentFilter.search || currentFilter.dateFrom || currentFilter.dateTo;
      if (!hasFilters) return alert('No active filters to save');
      const name = prompt('Name this filter:');
      if (name) {
        savedFilters.push({ name, filter: { ...currentFilter } });
        localStorage.setItem('bugvault_saved_filters', JSON.stringify(savedFilters));
        renderSavedFilters();
      }
    }

    function applySavedFilter(index) {
      const saved = savedFilters[index];
      if (saved) {
        currentFilter = { ...saved.filter };
        document.getElementById('searchInput').value = currentFilter.search || '';
        document.getElementById('dateFrom').value = currentFilter.dateFrom || '';
        document.getElementById('dateTo').value = currentFilter.dateTo || '';
        applyFilters();
      }
    }

    function deleteSavedFilter(index, e) {
      e.stopPropagation();
      savedFilters.splice(index, 1);
      localStorage.setItem('bugvault_saved_filters', JSON.stringify(savedFilters));
      renderSavedFilters();
    }

    function renderSavedFilters() {
      document.getElementById('savedFilters').innerHTML = savedFilters.length === 0 
        ? '<div style="font-size: 0.8rem; color: var(--text-muted);">No saved filters</div>'
        : savedFilters.map((f, i) => `
          <div class="saved-filter-item" onclick="applySavedFilter(${i})">
            <span>🔖</span>
            <span class="filter-name">${f.name}</span>
            <span class="delete-filter" onclick="deleteSavedFilter(${i}, event)">×</span>
          </div>
        `).join('');
    }

    // Recently viewed
    function addToRecentlyViewed(id) {
      recentlyViewed = recentlyViewed.filter(r => r !== id);
      recentlyViewed.unshift(id);
      recentlyViewed = recentlyViewed.slice(0, 5);
      localStorage.setItem('bugvault_recent', JSON.stringify(recentlyViewed));
      renderRecentlyViewed();
    }

    function renderRecentlyViewed() {
      const recent = recentlyViewed.map(id => issues.find(i => i.id === id)).filter(Boolean);
      document.getElementById('recentlyViewed').innerHTML = recent.length === 0
        ? '<div style="font-size: 0.8rem; color: var(--text-muted);">No recent issues</div>'
        : recent.map(i => `<div class="recent-item" onclick="viewIssue(${i.id})">${i.title}</div>`).join('');
    }

    // Render issues
    function renderIssues() {
      let filtered = [...issues];
      
      if (currentFilter.project) filtered = filtered.filter(i => i.project === currentFilter.project);
      if (currentFilter.tag) filtered = filtered.filter(i => (i.tags || []).includes(currentFilter.tag));
      if (currentFilter.search) {
        const s = currentFilter.search.toLowerCase();
        filtered = filtered.filter(i => 
          i.title.toLowerCase().includes(s) || 
          (i.error || '').toLowerCase().includes(s) || 
          (i.solution || '').toLowerCase().includes(s)
        );
      }
      if (currentFilter.dateFrom) filtered = filtered.filter(i => new Date(i.createdAt) >= new Date(currentFilter.dateFrom));
      if (currentFilter.dateTo) filtered = filtered.filter(i => new Date(i.createdAt) <= new Date(currentFilter.dateTo + 'T23:59:59'));

      // Sort
      const sort = document.getElementById('sortSelect').value;
      if (sort === 'newest') filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      else if (sort === 'oldest') filtered.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      else if (sort === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title));

      // Pinned first
      filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

      document.getElementById('contentTitle').textContent = `All Issues (${filtered.length})`;

      if (filtered.length === 0) {
        document.getElementById('issuesList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">No issues found</div>
            <p>Try adjusting your filters or add a new issue</p>
          </div>
        `;
        return;
      }

      document.getElementById('issuesList').innerHTML = filtered.map(issue => `
        <div class="issue-card ${issue.pinned ? 'pinned' : ''} ${selectedIssues.has(issue.id) ? 'selected' : ''}" onclick="${bulkMode ? '' : ('viewIssue(' + issue.id + ')')}">
          <div class="issue-header">
            ${bulkMode ? `<input type="checkbox" class="issue-checkbox" ${selectedIssues.has(issue.id) ? 'checked' : ''} onclick="toggleIssueSelection(${issue.id}, event)">` : ''}
            <div class="issue-title">${highlightText(issue.title)}</div>
            <div class="issue-date">${formatDate(issue.createdAt)}</div>
          </div>
          ${issue.error ? `<div class="issue-error">${highlightText(issue.error)}</div>` : ''}
          <div class="issue-meta">
            ${issue.project ? `<div class="issue-project"><span>📁</span> ${issue.project}</div>` : ''}
            <div class="issue-tags">
              ${(issue.tags || []).map(t => `<span class="issue-tag">${t}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function highlightText(text) {
      if (!currentFilter.search || !text) return text;
      const regex = new RegExp(`(${currentFilter.search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<span class="highlight">$1</span>');
    }

    // View issue detail
    function viewIssue(id) {
      console.log('viewIssue called with id:', id, typeof id);
      const issue = issues.find(i => String(i.id) === String(id));
      console.log('Found issue:', issue);
      if (!issue) return;
      addToRecentlyViewed(id);

      document.getElementById('detailTitle').textContent = issue.title;
      document.getElementById('detailBody').innerHTML = `
        ${issue.error ? `<div class="detail-section"><div class="detail-label">Error Message</div><div class="detail-error">${issue.error}</div></div>` : ''}
        ${issue.solution ? `<div class="detail-section"><div class="detail-label">Solution</div><div class="detail-solution">${parseMarkdown(issue.solution)}</div></div>` : ''}
        ${issue.context ? `<div class="detail-section"><div class="detail-label">Context</div><div class="detail-context">${issue.context}</div></div>` : ''}
        <div class="detail-meta">
          <div class="detail-meta-item"><div class="detail-meta-label">Project</div><div class="detail-meta-value">${issue.project || 'None'}</div></div>
          <div class="detail-meta-item"><div class="detail-meta-label">Tags</div><div class="detail-meta-value">${(issue.tags || []).join(', ') || 'None'}</div></div>
          <div class="detail-meta-item"><div class="detail-meta-label">Created</div><div class="detail-meta-value">${formatDate(issue.createdAt)}</div></div>
        </div>
        <div class="detail-actions">
          <button class="btn btn-secondary" onclick="editIssue(${id})">✏️ Edit</button>
          <button class="btn btn-secondary" onclick="duplicateIssue(${id})">📋 Duplicate</button>
          <button class="btn btn-${issue.pinned ? 'warning' : 'secondary'}" onclick="togglePin(${id})">${issue.pinned ? '📌 Unpin' : '📌 Pin'}</button>
          <button class="btn btn-secondary" onclick="shareIssue(${id})">🔗 Share</button>
          <button class="btn btn-danger" onclick="deleteIssue(${id})">🗑️ Delete</button>
        </div>
      `;
      openModal('detail');
    }

    function parseMarkdown(text) {
      if (!text) return '';
      return text
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\n/g, '<br>');
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // CRUD operations
    function openModal(type) {
      document.getElementById(type + 'Modal').classList.add('active');
    }

    function closeModal(type) {
      document.getElementById(type + 'Modal').classList.remove('active');
      if (type === 'add') {
        document.getElementById('editId').value = '';
        document.getElementById('issueTitle').value = '';
        document.getElementById('issueError').value = '';
        document.getElementById('issueSolution').value = '';
        document.getElementById('issueProject').value = '';
        document.getElementById('issueTags').value = '';
        document.getElementById('issueContext').value = '';
        document.getElementById('modalTitle').textContent = 'New Issue';
      }
    }

    function saveIssue() {
      const title = document.getElementById('issueTitle').value.trim();
      if (!title) return alert('Title is required');

      const editId = document.getElementById('editId').value;
      const issueData = {
        title,
        error: document.getElementById('issueError').value.trim(),
        solution: document.getElementById('issueSolution').value.trim(),
        project: document.getElementById('issueProject').value.trim(),
        tags: document.getElementById('issueTags').value.split(',').map(t => t.trim()).filter(t => t),
        context: document.getElementById('issueContext').value.trim()
      };

      if (editId) {
        const index = issues.findIndex(i => i.id === parseInt(editId));
        if (index !== -1) issues[index] = { ...issues[index], ...issueData };
      } else {
        issues.push({ id: Date.now(), ...issueData, createdAt: new Date().toISOString(), pinned: false });
      }

      saveIssues();
      closeModal('add');
      renderFilters();
      renderIssues();
    }

    function editIssue(id) {
      const issue = issues.find(i => String(i.id) === String(id));
      if (!issue) return;
      closeModal('detail');
      document.getElementById('editId').value = id;
      document.getElementById('issueTitle').value = issue.title;
      document.getElementById('issueError').value = issue.error || '';
      document.getElementById('issueSolution').value = issue.solution || '';
      document.getElementById('issueProject').value = issue.project || '';
      document.getElementById('issueTags').value = (issue.tags || []).join(', ');
      document.getElementById('issueContext').value = issue.context || '';
      document.getElementById('modalTitle').textContent = 'Edit Issue';
      openModal('add');
    }

    function deleteIssue(id) {
      if (confirm('Delete this issue?')) {
        issues = issues.filter(i => i.id !== id);
        saveIssues();
        closeModal('detail');
        renderFilters();
        renderIssues();
      }
    }

    function duplicateIssue(id) {
      const issue = issues.find(i => String(i.id) === String(id));
      if (!issue) return;
      const copy = { ...issue, id: Date.now(), title: issue.title + ' (copy)', createdAt: new Date().toISOString(), pinned: false };
      issues.push(copy);
      saveIssues();
      closeModal('detail');
      renderFilters();
      renderIssues();
    }

    function togglePin(id) {
      const issue = issues.find(i => String(i.id) === String(id));
      if (issue) {
        issue.pinned = !issue.pinned;
        saveIssues();
        closeModal('detail');
        renderIssues();
      }
    }

    // Import/Export
    function exportData() {
      const data = { issues, exportedAt: new Date().toISOString(), version: '2.0' };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bugvault-export-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          const importedIssues = data.issues || data;
          if (Array.isArray(importedIssues)) {
            const count = importedIssues.length;
            importedIssues.forEach(issue => {
              if (!issue.id) issue.id = Date.now() + Math.random();
              if (!issues.find(i => i.id === issue.id)) issues.push(issue);
            });
            saveIssues();
            renderFilters();
            renderIssues();
            alert(`Imported ${count} issues!`);
          }
        } catch (err) { alert('Invalid JSON file'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function saveIssues() {
      localStorage.setItem('bugvault_issues', JSON.stringify(issues));
    }
  </script>
</body>
</html>
