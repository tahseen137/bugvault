<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugVault — Developer Issue Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0a0f;
      --bg-main: #12121a;
      --bg-card: #1a1a25;
      --bg-elevated: #22222f;
      --border: #2a2a3a;
      --border-focus: #4a4a6a;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted: #5a5a70;
      --accent-green: #3dd68c;
      --accent-green-dim: #2a9963;
      --accent-red: #f0506e;
      --accent-orange: #f5a623;
      --accent-blue: #5c9eff;
      --accent-purple: #a78bfa;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Space Grotesk', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-focus); }

    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

    .header {
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .logo { display: flex; align-items: center; gap: 0.75rem; }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-blue) 100%);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 14px;
      color: var(--bg-deep);
    }

    .logo-text { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; }
    .logo-text span { color: var(--text-muted); font-weight: 400; }

    .search-container { flex: 1; max-width: 500px; position: relative; }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.1);
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    .header-actions { display: flex; gap: 0.75rem; }

    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary { background: var(--accent-green); color: var(--bg-deep); }
    .btn-primary:hover { background: #4de69c; transform: translateY(-1px); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); }
    .btn-danger:hover { background: var(--accent-red); color: white; }
    .btn-warning { background: transparent; color: var(--accent-orange); border: 1px solid var(--accent-orange); }
    .btn-warning:hover { background: var(--accent-orange); color: var(--bg-deep); }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.8rem; }

    .main { display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }

    .sidebar {
      background: var(--bg-main);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
    }

    .sidebar-section { margin-bottom: 2rem; }

    .sidebar-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .filter-group { display: flex; flex-direction: column; gap: 0.25rem; }

    .filter-btn {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.625rem 0.75rem;
      background: transparent; border: none; border-radius: 6px;
      color: var(--text-secondary);
      font-family: var(--font-sans); font-size: 0.875rem;
      cursor: pointer; transition: all 0.15s ease; text-align: left;
    }

    .filter-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .filter-btn.active { background: var(--bg-elevated); color: var(--accent-green); }
    .filter-count { margin-left: auto; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }

    .tag-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .tag {
      padding: 0.375rem 0.75rem;
      background: var(--bg-elevated);
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .tag:hover { border-color: var(--border-focus); color: var(--text-primary); }
    .tag.active { background: var(--accent-green); color: var(--bg-deep); }

    .recent-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .recent-item {
      padding: 0.5rem 0.75rem;
      background: var(--bg-elevated);
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-item:hover { color: var(--text-primary); background: var(--border); }

    .content { padding: 2rem; overflow-y: auto; background: var(--bg-deep); }

    .content-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .content-title { font-size: 1.25rem; font-weight: 600; }

    .sort-select {
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      cursor: pointer;
    }

    .issues-list { display: flex; flex-direction: column; gap: 1rem; }

    .issue-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .issue-card:hover {
      border-color: var(--border-focus);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .issue-card.pinned { border-color: var(--accent-orange); }
    .issue-card.pinned::before {
      content: '📌';
      position: absolute;
      top: -8px;
      right: 12px;
      font-size: 1rem;
    }

    .issue-header { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 0.75rem; }
    .issue-title { font-weight: 600; font-size: 1rem; flex: 1; line-height: 1.4; }
    .issue-date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }

    .issue-error {
      background: var(--bg-deep);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-red);
      margin-bottom: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .issue-meta { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .issue-project { display: flex; align-items: center; gap: 0.375rem; font-size: 0.8rem; color: var(--accent-blue); }
    .issue-tags { display: flex; gap: 0.375rem; flex-wrap: wrap; }
    .issue-tag { padding: 0.25rem 0.5rem; background: var(--bg-elevated); border-radius: 4px; font-size: 0.7rem; font-family: var(--font-mono); color: var(--text-secondary); }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty-title { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 0.5rem; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden;
      transition: all 0.2s ease; padding: 2rem;
    }

    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%; max-width: 700px; max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal { transform: translateY(0); }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-title { font-size: 1.125rem; font-weight: 600; }

    .modal-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none;
      color: var(--text-muted); cursor: pointer;
      border-radius: 6px; font-size: 1.25rem;
      transition: all 0.15s ease;
    }

    .modal-close:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .modal-body { padding: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-secondary); }
    .form-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.1);
    }

    .form-textarea { min-height: 100px; resize: vertical; font-family: var(--font-mono); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .modal-footer {
      display: flex; justify-content: flex-end; gap: 0.75rem;
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border);
    }

    .detail-section { margin-bottom: 1.5rem; }
    .detail-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.5rem; }

    .detail-error {
      background: var(--bg-card); border-radius: 8px; padding: 1rem;
      font-family: var(--font-mono); font-size: 0.85rem;
      color: var(--accent-red); white-space: pre-wrap; word-break: break-word;
      border-left: 3px solid var(--accent-red);
    }

    .detail-solution {
      background: var(--bg-card); border-radius: 8px; padding: 1rem;
      font-size: 0.9rem; line-height: 1.7;
      border-left: 3px solid var(--accent-green);
    }

    .detail-solution code {
      background: var(--bg-deep);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-purple);
    }

    .detail-solution pre {
      background: var(--bg-deep);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.75rem 0;
    }

    .detail-solution pre code {
      background: none;
      padding: 0;
      color: var(--text-primary);
    }

    .detail-solution a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    .detail-solution a:hover { text-decoration: underline; }

    .detail-context { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7; }

    .detail-meta {
      display: flex; flex-wrap: wrap; gap: 1.5rem;
      padding-top: 1rem; border-top: 1px solid var(--border);
    }

    .detail-meta-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .detail-meta-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .detail-meta-value { font-size: 0.875rem; color: var(--text-primary); }

    .detail-actions {
      display: flex; gap: 0.75rem; flex-wrap: wrap;
      margin-top: 1.5rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
    }

    .stat-value { font-size: 2rem; font-weight: 700; font-family: var(--font-mono); margin-bottom: 0.25rem; color: var(--accent-blue); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .form-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .header { flex-wrap: wrap; padding: 1rem; }
      .search-container { order: 3; max-width: none; width: 100%; }
      .content { padding: 1rem; }
      .detail-actions { flex-direction: column; }
      .detail-actions .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">🐛</div>
        <div class="logo-text">BugVault <span>Issue Tracker</span></div>
      </div>
      
      <div class="search-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search issues, errors, solutions...">
      </div>

      <div class="header-actions">
        <button class="btn btn-secondary" onclick="exportData()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export
        </button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Import
        </button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn btn-primary" onclick="openModal('add')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Issue
        </button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">Recently Viewed</div>
          <div class="recent-list" id="recentList"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Projects</div>
          <div class="filter-group" id="projectFilters"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Tags</div>
          <div class="tag-list" id="tagFilters"></div>
        </div>
      </aside>

      <div class="content">
        <div class="stat-card" style="margin-bottom: 2rem;">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total Issues</div>
        </div>

        <div class="content-header">
          <h2 class="content-title" id="contentTitle">All Issues</h2>
          <select class="sort-select" id="sortSelect" onchange="renderIssues()">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="title">Alphabetical</option>
          </select>
        </div>

        <div class="issues-list" id="issuesList"></div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalAdd">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalAddTitle">Log New Issue</h3>
        <button class="modal-close" onclick="closeModal('add')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" class="form-input" id="issueTitle" placeholder="Brief description of the issue">
        </div>

        <div class="form-group">
          <label class="form-label">Error Message</label>
          <textarea class="form-textarea" id="issueError" placeholder="Paste the error message or stack trace"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Context</label>
          <textarea class="form-textarea" id="issueContext" placeholder="What were you doing when this happened?" style="font-family: var(--font-sans)"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Solution (Markdown supported)</label>
          <textarea class="form-textarea" id="issueSolution" placeholder="How did you fix it? Use **bold**, `code`, ```code blocks```, [links](url)"></textarea>
          <div class="form-hint">Supports: **bold**, *italic*, `inline code`, ```code blocks```, [links](url)</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Project</label>
            <input type="text" class="form-input" id="issueProject" placeholder="e.g., my-app">
          </div>
          <div class="form-group">
            <label class="form-label">Tags (comma separated)</label>
            <input type="text" class="form-input" id="issueTags" placeholder="e.g., react, api, auth">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('add')">Cancel</button>
        <button class="btn btn-primary" onclick="saveIssue()">Save Issue</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalDetail">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">Issue Details</h3>
        <button class="modal-close" onclick="closeModal('detail')">&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <script>
    let issues = [];
    let recentlyViewed = [];
    let currentFilter = { project: null, tag: null };
    let searchQuery = '';

    function init() {
      loadData();
      loadRecentlyViewed();
      renderIssues();
      renderRecentlyViewed();
      updateFilters();
      updateStats();
      
      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderIssues();
      });
    }

    function loadData() {
      const saved = localStorage.getItem('bugvault_issues');
      if (saved) issues = JSON.parse(saved);
    }

    function saveData() {
      localStorage.setItem('bugvault_issues', JSON.stringify(issues));
    }

    function loadRecentlyViewed() {
      const saved = localStorage.getItem('bugvault_recent');
      if (saved) recentlyViewed = JSON.parse(saved);
    }

    function saveRecentlyViewed() {
      localStorage.setItem('bugvault_recent', JSON.stringify(recentlyViewed));
    }

    function addToRecentlyViewed(id) {
      recentlyViewed = recentlyViewed.filter(r => r !== id);
      recentlyViewed.unshift(id);
      recentlyViewed = recentlyViewed.slice(0, 5);
      saveRecentlyViewed();
      renderRecentlyViewed();
    }

    function renderRecentlyViewed() {
      const container = document.getElementById('recentList');
      const recentIssues = recentlyViewed.map(id => issues.find(i => i.id === id)).filter(Boolean);
      
      if (recentIssues.length === 0) {
        container.innerHTML = '<div class="recent-item" style="cursor: default; color: var(--text-muted);">No recent issues</div>';
        return;
      }
      
      container.innerHTML = recentIssues.map(issue => `
        <div class="recent-item" onclick="viewIssue('${issue.id}')">${escapeHtml(issue.title)}</div>
      `).join('');
    }

    function exportData() {
      const data = JSON.stringify(issues, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bugvault-export-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            if (confirm(`Import ${imported.length} issues? This will merge with existing data.`)) {
              const existingIds = new Set(issues.map(i => i.id));
              const newIssues = imported.filter(i => !existingIds.has(i.id));
              issues = [...issues, ...newIssues];
              saveData();
              renderIssues();
              updateFilters();
              updateStats();
              alert(`Imported ${newIssues.length} new issues.`);
            }
          }
        } catch (err) { alert('Invalid JSON file'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function openModal(type) {
      document.getElementById(`modal${type.charAt(0).toUpperCase() + type.slice(1)}`).classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(type) {
      document.getElementById(`modal${type.charAt(0).toUpperCase() + type.slice(1)}`).classList.remove('active');
      document.body.style.overflow = '';
      if (type === 'add') clearForm();
    }

    function clearForm() {
      document.getElementById('editId').value = '';
      document.getElementById('issueTitle').value = '';
      document.getElementById('issueError').value = '';
      document.getElementById('issueContext').value = '';
      document.getElementById('issueSolution').value = '';
      document.getElementById('issueProject').value = '';
      document.getElementById('issueTags').value = '';
      document.getElementById('modalAddTitle').textContent = 'Log New Issue';
    }

    function saveIssue() {
      const title = document.getElementById('issueTitle').value.trim();
      if (!title) { alert('Title is required'); return; }

      const editId = document.getElementById('editId').value;
      const existingIssue = editId ? issues.find(i => i.id === editId) : null;
      
      const issue = {
        id: editId || Date.now().toString(),
        title,
        error: document.getElementById('issueError').value.trim(),
        context: document.getElementById('issueContext').value.trim(),
        solution: document.getElementById('issueSolution').value.trim(),
        project: document.getElementById('issueProject').value.trim(),
        tags: document.getElementById('issueTags').value.split(',').map(t => t.trim()).filter(Boolean),
        pinned: existingIssue?.pinned || false,
        createdAt: existingIssue?.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      if (editId) {
        const index = issues.findIndex(i => i.id === editId);
        if (index !== -1) issues[index] = issue;
      } else {
        issues.unshift(issue);
      }

      saveData();
      closeModal('add');
      renderIssues();
      updateFilters();
      updateStats();
    }

    function duplicateIssue(id) {
      const issue = issues.find(i => i.id === id);
      if (!issue) return;

      const duplicate = {
        ...issue,
        id: Date.now().toString(),
        title: `${issue.title} (copy)`,
        pinned: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      issues.unshift(duplicate);
      saveData();
      closeModal('detail');
      renderIssues();
      updateFilters();
      updateStats();
    }

    function togglePin(id) {
      const issue = issues.find(i => i.id === id);
      if (issue) {
        issue.pinned = !issue.pinned;
        issue.updatedAt = new Date().toISOString();
        saveData();
        closeModal('detail');
        renderIssues();
      }
    }

    function setFilter(type, value) {
      if (type === 'project') {
        currentFilter.project = currentFilter.project === value ? null : value;
        document.querySelectorAll('.filter-btn[data-project]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.project === currentFilter.project);
        });
      } else if (type === 'tag') {
        currentFilter.tag = currentFilter.tag === value ? null : value;
        document.querySelectorAll('.tag[data-tag]').forEach(tag => {
          tag.classList.toggle('active', tag.dataset.tag === currentFilter.tag);
        });
      }
      renderIssues();
    }

    function getFilteredIssues() {
      return issues.filter(issue => {
        if (currentFilter.project && issue.project !== currentFilter.project) return false;
        if (currentFilter.tag && !issue.tags.includes(currentFilter.tag)) return false;
        if (searchQuery) {
          const searchable = [issue.title, issue.error, issue.context, issue.solution, issue.project, ...issue.tags].join(' ').toLowerCase();
          if (!searchable.includes(searchQuery)) return false;
        }
        return true;
      });
    }

    function renderIssues() {
      const filtered = getFilteredIssues();
      const sort = document.getElementById('sortSelect').value;
      
      // Sort: pinned first, then by selected sort
      filtered.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        if (sort === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
        if (sort === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
        if (sort === 'title') return a.title.localeCompare(b.title);
        return 0;
      });

      const list = document.getElementById('issuesList');
      
      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <div class="empty-title">No issues found</div>
            <p>Start logging issues to build your knowledge base</p>
          </div>
        `;
        document.getElementById('contentTitle').textContent = 'All Issues (0)';
        return;
      }

      list.innerHTML = filtered.map(issue => `
        <div class="issue-card ${issue.pinned ? 'pinned' : ''}" onclick="viewIssue('${issue.id}')">
          <div class="issue-header">
            <div class="issue-title">${escapeHtml(issue.title)}</div>
            <div class="issue-date">${formatDate(issue.createdAt)}</div>
          </div>
          ${issue.error ? `<div class="issue-error">${escapeHtml(issue.error)}</div>` : ''}
          <div class="issue-meta">
            ${issue.project ? `
              <div class="issue-project">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                ${escapeHtml(issue.project)}
              </div>
            ` : ''}
            ${issue.tags.length ? `
              <div class="issue-tags">
                ${issue.tags.map(tag => `<span class="issue-tag">${escapeHtml(tag)}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');

      let title = 'All Issues';
      if (currentFilter.project) title = `Project: ${currentFilter.project}`;
      if (currentFilter.tag) title = `Tag: ${currentFilter.tag}`;
      document.getElementById('contentTitle').textContent = `${title} (${filtered.length})`;
    }

    function updateFilters() {
      const projects = [...new Set(issues.map(i => i.project).filter(Boolean))];
      document.getElementById('projectFilters').innerHTML = projects.map(project => `
        <button class="filter-btn ${currentFilter.project === project ? 'active' : ''}" 
                data-project="${escapeHtml(project)}" 
                onclick="setFilter('project', '${escapeHtml(project)}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          ${escapeHtml(project)}
          <span class="filter-count">${issues.filter(i => i.project === project).length}</span>
        </button>
      `).join('');

      const tags = [...new Set(issues.flatMap(i => i.tags))];
      document.getElementById('tagFilters').innerHTML = tags.map(tag => `
        <span class="tag ${currentFilter.tag === tag ? 'active' : ''}" 
              data-tag="${escapeHtml(tag)}" 
              onclick="setFilter('tag', '${escapeHtml(tag)}')">${escapeHtml(tag)}</span>
      `).join('');
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = issues.length;
    }

    function parseMarkdown(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      
      // Code blocks (```code```)
      html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      
      // Inline code (`code`)
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      
      // Bold (**text**)
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      
      // Italic (*text*)
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      
      // Links [text](url)
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      
      // Line breaks
      html = html.replace(/\n/g, '<br>');
      
      return html;
    }

    function viewIssue(id) {
      const issue = issues.find(i => i.id === id);
      if (!issue) return;

      addToRecentlyViewed(id);

      document.getElementById('detailTitle').textContent = issue.title;
      document.getElementById('detailBody').innerHTML = `
        ${issue.error ? `
          <div class="detail-section">
            <div class="detail-label">Error Message</div>
            <div class="detail-error">${escapeHtml(issue.error)}</div>
          </div>
        ` : ''}
        ${issue.context ? `
          <div class="detail-section">
            <div class="detail-label">Context</div>
            <div class="detail-context">${escapeHtml(issue.context)}</div>
          </div>
        ` : ''}
        ${issue.solution ? `
          <div class="detail-section">
            <div class="detail-label">Solution</div>
            <div class="detail-solution">${parseMarkdown(issue.solution)}</div>
          </div>
        ` : ''}
        <div class="detail-meta">
          ${issue.project ? `
            <div class="detail-meta-item">
              <span class="detail-meta-label">Project</span>
              <span class="detail-meta-value">${escapeHtml(issue.project)}</span>
            </div>
          ` : ''}
          <div class="detail-meta-item">
            <span class="detail-meta-label">Created</span>
            <span class="detail-meta-value">${formatDate(issue.createdAt)}</span>
          </div>
          ${issue.tags.length ? `
            <div class="detail-meta-item">
              <span class="detail-meta-label">Tags</span>
              <span class="detail-meta-value">${issue.tags.join(', ')}</span>
            </div>
          ` : ''}
        </div>
        <div class="detail-actions">
          <button class="btn btn-primary" onclick="editIssue('${issue.id}')">Edit</button>
          <button class="btn btn-secondary" onclick="duplicateIssue('${issue.id}')">Duplicate</button>
          <button class="btn btn-warning" onclick="togglePin('${issue.id}')">${issue.pinned ? 'Unpin' : 'Pin'}</button>
          <button class="btn btn-danger" onclick="deleteIssue('${issue.id}')">Delete</button>
        </div>
      `;
      openModal('detail');
    }

    function editIssue(id) {
      const issue = issues.find(i => i.id === id);
      if (!issue) return;

      closeModal('detail');
      
      document.getElementById('editId').value = issue.id;
      document.getElementById('issueTitle').value = issue.title;
      document.getElementById('issueError').value = issue.error;
      document.getElementById('issueContext').value = issue.context;
      document.getElementById('issueSolution').value = issue.solution;
      document.getElementById('issueProject').value = issue.project;
      document.getElementById('issueTags').value = issue.tags.join(', ');
      document.getElementById('modalAddTitle').textContent = 'Edit Issue';

      openModal('add');
    }

    function deleteIssue(id) {
      if (confirm('Delete this issue permanently?')) {
        issues = issues.filter(i => i.id !== id);
        recentlyViewed = recentlyViewed.filter(r => r !== id);
        saveData();
        saveRecentlyViewed();
        closeModal('detail');
        renderIssues();
        renderRecentlyViewed();
        updateFilters();
        updateStats();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, (m) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m]));
    }

    function formatDate(iso) {
      const date = new Date(iso);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 86400000) {
        const hours = Math.floor(diff / 3600000);
        if (hours < 1) return 'Just now';
        return `${hours}h ago`;
      }
      if (diff < 604800000) {
        const days = Math.floor(diff / 86400000);
        return `${days}d ago`;
      }
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal('add'); closeModal('detail'); }
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) { closeModal('add'); closeModal('detail'); }
      });
    });

    init();
  </script>
</body>
</html>
